services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: parsing_dev_password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    working_dir: /workspace
    volumes:
      - ./src/ParsingEndpoint:/workspace/src/ParsingEndpoint
      - nuget_cache:/root/.nuget/packages
    tmpfs:
      - /workspace/src/ParsingEndpoint/obj
      - /workspace/src/ParsingEndpoint/bin
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8090
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=parsing_dev_password
      YUNIQL_CONNECTION_STRING: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=parsing_dev_password
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -ec 'dotnet restore src/ParsingEndpoint/ParsingEndpoint.csproj &&
      dotnet build src/ParsingEndpoint/ParsingEndpoint.csproj -c Release --no-restore &&
      /tools/yuniql run --platform postgresql --path src/ParsingEndpoint/Database/Migrations &&
      exec dotnet src/ParsingEndpoint/bin/Release/net10.0/ParsingEndpoint.dll'

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: parsing_dev_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgadmin4/pgpass.conf
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass.conf:/pgadmin4/pgpass.conf:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  nuget_cache:
